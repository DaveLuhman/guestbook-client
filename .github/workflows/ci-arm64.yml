name: ci-arm64
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cache (Cargo + npm)
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      # Emulated ARM64 environment
      - uses: uraimo/run-on-arch-action@v2
        name: Build in aarch64 container
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update
            apt-get install -y curl git ca-certificates pkg-config build-essential patchelf wget \
              nodejs npm \
              libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
              libayatana-appindicator3-dev librsvg2-dev \
              libudev1 libudev-dev \
              gstreamer1.0-tools \
              gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
              gstreamer1.0-libav
            curl https://sh.rustup.rs -sSf | sh -s -- -y
            source $HOME/.cargo/env
            cargo install tauri-cli
            # Install linuxdeploy for AppImage bundling
            LINUXDEPLOY_DIR="$HOME/.local/bin"
            mkdir -p "$LINUXDEPLOY_DIR"
            LINUXDEPLOY_VERSION="continuous"
            wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-aarch64.AppImage" -O "$LINUXDEPLOY_DIR/linuxdeploy-aarch64.AppImage"
            chmod +x "$LINUXDEPLOY_DIR/linuxdeploy-aarch64.AppImage"
            ln -s "linuxdeploy-aarch64.AppImage" "$LINUXDEPLOY_DIR/linuxdeploy.AppImage"
            # Install linuxdeploy plugins
            wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-plugin-gtk-aarch64.AppImage" -O "$LINUXDEPLOY_DIR/linuxdeploy-plugin-gtk.AppImage"
            chmod +x "$LINUXDEPLOY_DIR/linuxdeploy-plugin-gtk.AppImage"
            wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-appstream/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-plugin-appstream-aarch64.AppImage" -O "$LINUXDEPLOY_DIR/linuxdeploy-plugin-appstream.AppImage"
            chmod +x "$LINUXDEPLOY_DIR/linuxdeploy-plugin-appstream.AppImage"
            export PATH="$PATH:$LINUXDEPLOY_DIR"
          run: |
            export PATH="$PATH:$HOME/.local/bin"
            npm ci
            cargo tauri build --bundles appimage
            ls -la src-tauri/target/release/bundle || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guestbook-arm64
          path: |
            src-tauri/target/release/bundle/appimage/*arm64*.AppImage
